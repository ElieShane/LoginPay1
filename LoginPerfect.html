.view{display:none;min-height:100vh;padding:24px;align-items:center}
.view.on{display:flex}
.wrap{display:flex;width:100%;justify-content:center}
@media (min-width:860px){.wrap.right{justify-content:flex-end;padding-right:6vw}}
@media (max-width:859px){.view{align-items:flex-end}.wrap.right{padding-top:40vh}}
.card{width:100%;max-width:400px;background:var(--card);border-radius:20px;padding:30px 28px;box-shadow:0 20px 50px rgba(0,40,90,.28);backdrop-filter:blur(8px)}
.card.wide{max-width:460px}
h1{margin:0 0 4px;font-size:1.6rem}
p.sub{margin:0 0 22px;color:var(--muted);font-size:.95rem}
label{display:block;font-size:.85rem;font-weight:600;margin:14px 0 6px}
input,textarea{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--ink);font:inherit}
input:focus,textarea:focus{outline:2px solid var(--brand);border-color:transparent}
textarea{resize:vertical;min-height:80px}
button{font:inherit;cursor:pointer}
.btn{width:100%;margin-top:22px;padding:13px;border:0;border-radius:10px;background:var(--brand);color:#fff;font-weight:700}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--brand);margin-top:10px}
.msg{min-height:1.2em;margin-top:12px;font-size:.88rem;color:#d23b3b}
.msg.ok{color:#1c8a4a}
.qr{display:flex;flex-direction:column;align-items:center;margin-top:24px;padding-top:20px;border-top:1px solid var(--line)}
#qrbox{background:#fff;padding:12px;border-radius:12px;cursor:pointer;line-height:0}
.token{margin-top:10px;font-family:ui-monospace,Menlo,monospace;font-size:.85rem;color:var(--muted)}
.err{text-align:center;color:#fff}
.err .card{text-align:center}
.err .big{font-size:5rem;font-weight:800;color:var(--brand);margin:0;line-height:1}
</style></head><body>

<section class="view" id="login"><div class="wrap right"><form class="card" id="loginForm" autocomplete="off">
<h1>Welcome back</h1><p class="sub">Log in to continue</p>
<label for="uid">Login ID</label><input id="uid" placeholder="Enter your login ID">
<label for="pw">Password</label><input id="pw" type="password" placeholder="Enter your password">
<div class="msg" id="loginMsg"></div>
<button class="btn" type="submit">Login</button></form></div></section>

<section class="view" id="details"><div class="wrap right"><div class="card wide">
<h1>Your details</h1><p class="sub">Fill in your information below</p>
<form id="detForm" autocomplete="off">
<label for="fn">Full name</label><input id="fn" placeholder="e.g. Prateek Sharma">
<label for="pay">@pay ID</label><input id="pay" placeholder="@yourname">
<label for="ad">Address</label><textarea id="ad" placeholder="House no., street, city, PIN"></textarea>
<div class="msg" id="detMsg"></div>
<button class="btn" type="submit">Save details</button></form>
<div class="qr"><div id="qrbox" title="Tap to open"></div><div class="token" id="token"></div>
<button class="btn ghost" id="regen" type="button">Generate new QR</button></div>
<button class="btn ghost" id="logout" type="button">Log out</button>
</div></div></section>

<section class="view" id="error-404"><div class="wrap"><div class="card"><p class="big" style="font-size:5rem;font-weight:800;color:var(--brand);margin:0;line-height:1">404</p>
<h1 style="margin-top:10px">You are not the admin</h1>
<p class="sub">This page is restricted to administrators.</p>
<button class="btn" id="back" type="button">Back to details</button></div></div></section>

<script>
var loggedIn=false;
function $(i){return document.getElementById(i)}
function route(){
  var h=(location.hash||'#login').slice(1);
  if(['login','details','error-404'].indexOf(h)<0)h='login';
  if(h!=='login'&&!loggedIn){h='login';}
  ['login','details','error-404'].forEach(function(v){$(v).classList.toggle('on',v===h)});
  if(h==='details')makeQR();
}
window.addEventListener('hashchange',route);
$('loginForm').addEventListener('submit',function(e){
  e.preventDefault();
  if(!$('uid').value.trim()||!$('pw').value){$('loginMsg').textContent='Please enter both your login ID and password.';return}
  loggedIn=true;$('loginMsg').textContent='';location.hash='details';
});
$('detForm').addEventListener('submit',function(e){
  e.preventDefault();var m=$('detMsg');m.className='msg';
  if(!$('fn').value.trim()||!$('ad').value.trim()){m.textContent='Please fill in your name and address.';return}
  if($('pay').value.trim().charAt(0)!=='@'||$('pay').value.trim().length<2){m.textContent='Your @pay ID must start with @.';return}
  m.className='msg ok';m.textContent='Details saved.';
});
$('logout').onclick=function(){loggedIn=false;location.hash='login'};
$('back').onclick=function(){location.hash='details'};
$('regen').onclick=makeQR;
function makeQR(){
  var t=Math.random().toString(36).slice(2,8).toUpperCase();
  var url=location.href.split('#')[0]+'#error-404';
  var box=$('qrbox');box.innerHTML='';
  try{new QRCode(box,{text:url,width:150,height:150,colorDark:'#000',colorLight:'#fff'})}catch(e){box.textContent='QR unavailable'}
  $('token').textContent='QR ID: '+t;
}
$('qrbox').onclick=function(){location.hash='error-404'};
route();
</script></body></html>
